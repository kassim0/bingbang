<!--
  Le nom de la liste est un vrai bouton : on peut l'atteindre avec Tab et l'activer avec Entrée.
  Son pseudo-élément ::after recouvre toute la carte (voir le .scss), donc un clic n'importe où
  sur la carte ouvre aussi la liste.
-->
<h2 class="list-title">
  <button type="button" class="open-list" (click)="open.emit()">{{ gamesList.name }}</button>
</h2>

@if (previewGames.length === 0) {
  <p class="empty">empty</p>
} @else {
  <ul class="preview">
    @for (entry of previewGames; track entry.id) {
      <li class="item-apercu-list">
        <app-game-cover [url]="entry.game.backgroundImage" [size]="35" />
        <span class="item-name">{{ entry.game.name }}</span>
      </li>
    }
  </ul>
}
