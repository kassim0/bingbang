<div class="auth-dialog">
  <button data-testid="auth-dialog-close" style="float:right; background-color: red;" (click)="close()"><mat-icon>close</mat-icon></button>

  <h3>{{ mode === 'login' ? 'Se connecter' : 'Créer un compte' }}</h3>

  <form (ngSubmit)="submit()">
    <mat-form-field *ngIf="mode === 'register'" appearance="outline" style="width: 100%;">
      <mat-label>Nom d'utilisateur</mat-label>
      <input matInput data-testid="auth-username-input" [(ngModel)]="username" name="username" required>
    </mat-form-field>

    <mat-form-field appearance="outline" style="width: 100%;">
      <mat-label>Email</mat-label>
      <input matInput type="email" data-testid="auth-email-input" [(ngModel)]="email" name="email" required>
    </mat-form-field>

    <mat-form-field appearance="outline" style="width: 100%;">
      <mat-label>Mot de passe</mat-label>
      <input matInput type="password" data-testid="auth-password-input" [(ngModel)]="password" name="password" required>
    </mat-form-field>

    <p *ngIf="errorMessage" class="error">{{ errorMessage }}</p>

    <div *ngIf="isSubmitting" style="display: flex; justify-content: center; margin: 10px;">
      <mat-spinner diameter="30"></mat-spinner>
    </div>

    <button mat-raised-button color="primary" type="submit" data-testid="auth-submit" [disabled]="isSubmitting" style="width: 100%;">
      {{ mode === 'login' ? 'Se connecter' : "S'inscrire" }}
    </button>
  </form>

  <button mat-button type="button" data-testid="auth-toggle-mode" (click)="toggleMode()" style="width: 100%; margin-top: 10px;">
    {{ mode === 'login' ? "Pas encore de compte ? S'inscrire" : "Déjà un compte ? Se connecter" }}
  </button>
</div>
