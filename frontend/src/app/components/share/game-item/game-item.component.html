<div class="game-item-container">
  <img src="{{game?.imageUrl}}" style="width: 50px; height: 50px; object-fit: cover">
  <span class="game-name">{{game?.name}}</span>
  <button mat-icon-button color="primary" data-testid="game-item-add" (click)="onAddGame()" title="Ajouter le jeu">
    <mat-icon>{{ isGameSelected() ? 'check_circle' : 'add' }}</mat-icon>
  </button>
</div>
