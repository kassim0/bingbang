<div class="game-item-container">
  <app-game-cover [url]="game?.imageUrl" />
  <span class="game-text">
    <span class="game-name" data-testid="game-item-name">{{ game?.name }}</span>
    @if (releaseYear) {
      <span class="game-year">{{ releaseYear }}</span>
    }
  </span>
  <button mat-icon-button type="button" color="primary" data-testid="game-item-add"
          [disabled]="alreadyInList"
          [attr.aria-label]="buttonLabel"
          [attr.aria-pressed]="alreadyInList ? null : isGameSelected()"
          [title]="buttonLabel"
          (click)="onAddGame()">
    <mat-icon aria-hidden="true">{{ icon }}</mat-icon>
  </button>
</div>
