<mat-form-field>
  <input matInput [(ngModel)]="editedName" name="gamesListName">
</mat-form-field>

<ul *ngFor="let gameItem of gamesList.games">
  <img src="{{gameItem?.game?.backgroundImage}}" style="width: 50px; height: 50px">
  <span class="game-name" [ngClass]="isGameSelected(gameItem.game) ? 'line-through' : '' " ]>{{gameItem?.game?.name}}</span>
  <button mat-icon-button color="primary" (click)="onDeleteGame(gameItem.game)" title="supprimer le jeu">
    <mat-icon>{{ isGameSelected(gameItem.game) ? 'restore_from_trash' : 'delete' }}</mat-icon>
  </button>
</ul>
<ul>
  <button mat-raised-button (click)="openGamesSearchPopup()" title="ajouter des jeux">+</button>
</ul>

<button mat-button style="background-color: green; color:white" (click)="saveModifGamesList()">save</button>
