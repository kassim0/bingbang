<button data-testid="my-list-close" style="float:right; background-color: red;" (click)="close()"><mat-icon>close</mat-icon></button>

<mat-form-field>
  <input matInput data-testid="edit-list-name-input" [(ngModel)]="editedName" name="gamesListName">
</mat-form-field>

<ul *ngFor="let gameItem of gamesList.games">
  <img src="{{gameItem?.game?.backgroundImage}}" style="width: 50px; height: 50px">
  <span class="game-name" [ngClass]="isGameSelected(gameItem.game) ? 'line-through' : '' " ]>{{gameItem?.game?.name}}</span>
  <button mat-icon-button color="primary" [attr.data-testid]="'delete-game-' + gameItem.game.id" (click)="onDeleteGame(gameItem.game)" title="supprimer le jeu">
    <mat-icon>{{ isGameSelected(gameItem.game) ? 'restore_from_trash' : 'delete' }}</mat-icon>
  </button>
</ul>
<ul>
  <button mat-raised-button data-testid="my-list-add-game" (click)="openGamesSearchPopup()" title="ajouter des jeux">+</button>
</ul>

<button mat-button data-testid="my-list-save" style="background-color: green; color:white" (click)="saveModifGamesList()">save</button>
<button mat-button data-testid="my-list-delete" style="background-color: red; color:white" (click)="deleteGamesList()">delete {{editedName}}</button>
