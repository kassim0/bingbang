# Configuration de la base de donnees PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/bingbang
spring.datasource.username=postgres
spring.datasource.password=test
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuration JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Configuration JWT
# ATTENTION : a surcharger via une variable d'environnement (JWT_SECRET) en production, ne jamais committer le vrai secret.
jwt.secret=${JWT_SECRET:changeme-dev-only-secret-key-please-override-me-1234567890}
jwt.expiration-ms=86400000
# Compte invité (sans email/mot de passe) : pas de moyen de se reconnecter s'il expire, donc duree longue (~3 ans)
jwt.guest-expiration-ms=94608000000

# Renvoie le message d'erreur (ex: "Email already in use") au lieu de "No message available", pour l'afficher côté front
server.error.include-message=always
