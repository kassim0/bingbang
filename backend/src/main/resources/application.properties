# Configuration de la base de donnees PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/bingbang
spring.datasource.username=postgres
spring.datasource.password=test
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuration JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Configuration JWT
# ATTENTION : a surcharger via une variable d'environnement (JWT_SECRET) en production, ne jamais committer le vrai secret.
jwt.secret=${JWT_SECRET:changeme-dev-only-secret-key-please-override-me-1234567890}
jwt.expiration-ms=86400000

#pour que le message « Email already in use » arrive bien jusqu'au front
server.error.include-message=always

# Configuration RAWG
rawg.url=https://api.rawg.io/api
# la clé est lue dans la variable d'environnement RAWG_API_KEY, ne jamais la committer
bingbang.rawgApiSecret=${RAWG_API_KEY}