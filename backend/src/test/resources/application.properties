# Base H2 en mémoire, recréée à chaque lancement des tests
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Hibernate crée les tables au démarrage et les supprime à la fin
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# Configuration JWT (le fichier de test remplace celui de main, il faut donc redéclarer ces propriétés)
jwt.secret=test-only-secret-key-for-integration-tests-1234567890
jwt.expiration-ms=86400000

server.error.include-message=always

# Configuration RAWG : adresse volontairement invalide pour qu'aucun test n'appelle le vrai RAWG par accident
rawg.url=http://rawg.invalid
bingbang.rawgApiSecret=test-rawg-key
